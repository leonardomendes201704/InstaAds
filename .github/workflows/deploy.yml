name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, instaads]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: bash deploy/deploy.sh
